<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagamento</title>
</head>
<body>
<div class="container">

  <nav class="etapas" aria-label="Etapas da compra">
    <div class="etapa ativa">
      <div class="num">1</div>
      <div class="nome">Dados da Entrega</div>
    </div>
    <div class="linha"></div>
    <div class="etapa">
      <div class="num">2</div>
      <div class="nome">Pagamento</div>
    </div>
    <div class="linha"></div>
    <div class="etapa">
      <div class="num">3</div>
      <div class="nome">Revisão</div>
    </div>
  </nav>

  <div class="layout">

    <div class="coluna-esq">

      <section class="card">
        <div class="titulo-secao">
          <div>
            <h2>Dados de entrega</h2>
            <p>Defina o local para receber sua compra</p>
          </div>
        </div>

        <form class="grid" onsubmit="return false;">
          <div class="campo full">
            <label for="nome">Nome completo</label>
            <input id="nome" type="text" placeholder="Digite seu nome completo">
          </div>

          <div class="campo">
            <label for="email">E-mail</label>
            <input id="email" type="email" placeholder="seu@email.com">
          </div>
          <div class="campo">
            <label for="telefone">Telefone</label>
            <input id="telefone" type="tel" placeholder="(00) 00000-0000">
          </div>

          <div class="campo">
            <label for="cep">CEP
              <a href="https://buscacepinter.correios.com.br/app/endereco/index.php" target="_blank" rel="noopener">Não sei meu CEP</a>
            </label>
            <input id="cep" type="text" placeholder="00000-000">
          </div>
          <div class="campo">
            <label for="estado">Estado</label>
            <select id="estado">
              <option value="">Selecione seu estado</option>
            </select>
          </div>

          <div class="campo">
            <label for="cidade">Cidade</label>
            <select id="cidade">
              <option value="">Selecione sua cidade</option>
            </select>
          </div>
          <div class="campo">
            <label for="rua">Rua</label>
            <input id="rua" type="text" placeholder="Digite o nome da rua">
          </div>

          <div class="campo">
            <label for="numero">Número</label>
            <input id="numero" type="text" placeholder="123">
          </div>
          <div class="campo">
            <label for="complemento">Complemento (opcional)</label>
            <input id="complemento" type="text" placeholder="Apartamento, bloco, etc.">
          </div>

          <div class="campo full">
            <label for="bairro">Bairro</label>
            <input id="bairro" type="text" placeholder="Digite seu bairro">
          </div>
        </form>
      </section>

      <section class="card">
        <div class="titulo-secao">
          <div>
            <h2>Forma de Pagamento</h2>
            <p>Seus dados e pagamento estão protegidos.</p>
          </div>
        </div>

        <div class="pagamentos">
          <label class="opcao"><input type="radio" name="pagamento" value="credito"> Cartão de crédito</label>
          <label class="opcao"><input type="radio" name="pagamento" value="pix"> Pix</label>
          <label class="opcao"><input type="radio" name="pagamento" value="boleto"> Boleto Bancário</label>
          <label class="opcao"><input type="radio" name="pagamento" value="nanacash"> Nanacash</label>
        </div>
      </section>
    </div>

    <aside class="card resumo">
      <h3>Resumo do pedido</h3>

      <div class="produto">
        <div class="img">
          <img src="./imagens/produtos/jaleco.png" alt="Produto selecionado">
        </div>

        <div class="info">
          <h4>Produto selecionado</h4>
          <p>Quantidade</p>
          <div class="qtd">
            <button type="button" id="menos" aria-label="Diminuir">-</button>
            <span id="qtd">1</span>
            <button type="button" id="mais" aria-label="Aumentar">+</button>
          </div>
        </div>
      </div>

      <div class="linha-valor subtotal">
        <span class="rot">Subtotal</span>
        <span class="val" id="subtotal">R$ 29,90</span>
      </div>
      <div class="linha-valor frete">
        <span class="rot">Frete</span>
        <span class="val" id="frete">R$ 5,00</span>
      </div>
      <div class="linha-valor total">
        <span class="rot">Total</span>
        <span class="val" id="total">R$ 34,90</span>
      </div>

      <button class="btn-finalizar" type="button">FINALIZAR COMPRA</button>
    </aside>

  </div>
</div>

<script>
  const PRECO = 29.90;
  const FRETE = 5.00;
  let qtd = 1;
  const fmt = v => "R$ " + v.toFixed(2).replace(".", ",");

  function atualizar() {
    document.getElementById("qtd").textContent = qtd;
    document.getElementById("subtotal").textContent = fmt(PRECO * qtd);
    document.getElementById("frete").textContent = fmt(FRETE);
    document.getElementById("total").textContent = fmt(PRECO * qtd + FRETE);
  }
  document.getElementById("mais").onclick  = () => { qtd++; atualizar(); };
  document.getElementById("menos").onclick = () => { if (qtd > 1) qtd--; atualizar(); };
</script>
</body>
</html>
